# Default values for Vectaris Helm chart

replicaCount:
  backend: 2
  frontend: 2

image:
  backend:
    repository: vectaris-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: vectaris-frontend
    tag: latest
    pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  backend:
    port: 8000
  frontend:
    port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: vectaris.example.com
      paths:
        - path: /api
          pathType: Prefix
          backend: backend
        - path: /
          pathType: Prefix
          backend: frontend
  tls: []
  #  - secretName: vectaris-tls
  #    hosts:
  #      - vectaris.example.com

resources:
  backend:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  frontend:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

autoscaling:
  enabled: false
  backend:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  frontend:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

nodeSelector: {}

tolerations: []

affinity: {}

# Backend configuration
backend:
  env:
    - name: ENVIRONMENT
      value: "production"
    - name: LOG_LEVEL
      value: "INFO"
    - name: OTEL_ENABLED
      value: "true"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://otel-collector:4317"
  
  # Secret environment variables (stored in Kubernetes Secret)
  secrets: {}
  #   API_KEY: "your-api-key"
  #   OPENAI_API_KEY: "sk-..."
  #   PROMETHEUS_URL: "http://prometheus:9090"

# Frontend configuration
frontend:
  env:
    - name: VITE_API_URL
      value: "http://vectaris-backend:8000"

# ServiceMonitor for Prometheus Operator (optional)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus
